name: Build human review packets

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'manuals/**'
      - 'qa/**'
      - 'scripts/**'
      - '.github/workflows/build-human-review-packets.yml'

permissions:
  contents: read

jobs:
  build-review-packets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build exact-SHA review packets
        shell: bash
        run: |
          set -euo pipefail
          sha="${GITHUB_SHA}"
          out="review-packets"
          rm -rf "$out"
          mkdir -p "$out"

          families=(
            "ai-risk-management"
            "cloud-ai-security/aws"
            "cloud-ai-security/google-cloud"
            "cloud-ai-security/ibm-cloud"
            "cloud-ai-security/microsoft-azure"
            "cloud-ai-security/oracle-cloud"
            "iso-iec-42001"
            "kali-linux-ai-security-forensics"
          )

          for family in "${families[@]}"; do
            slug="${family//\//__}"
            packet="$out/$slug"
            mkdir -p "$packet/manuals" "$packet/qa"

            for lang in en es-419 pt-BR; do
              src="manuals/$family/$lang"
              test -d "$src"
              mkdir -p "$packet/manuals/$lang"
              find "$src" -maxdepth 1 -type f \
                \( -name '*.docx' -o -name '*.pdf' -o -name 'README.md' \) \
                -exec cp -p {} "$packet/manuals/$lang/" \;
            done

            if test -d "qa/$slug"; then
              cp -a "qa/$slug/." "$packet/qa/"
            fi
            if test -d "qa/${family##*/}"; then
              cp -a "qa/${family##*/}/." "$packet/qa/" || true
            fi

            cp qa/human-review/REVIEW_ATTESTATION_TEMPLATE.md "$packet/REVIEW_ATTESTATION_TEMPLATE.md"
            cp qa/human-review/REVIEW_MATRIX.csv "$packet/REVIEW_MATRIX_MASTER.csv"

            cat > "$packet/REVIEW_INSTRUCTIONS.md" <<EOF
          # Human Review Packet

          **Manual family:** \`manuals/$family\`  
          **Exact candidate SHA:** \`$sha\`  
          **Generated by workflow run:** \`${GITHUB_RUN_ID}\`

          This packet contains the English authority, Latin American Spanish edition, Brazilian Portuguese edition, available QA evidence, and the attributable attestation template.

          ## Required review disciplines

          1. Native-language editorial and semantic review for es-419 and pt-BR.
          2. Technical/security review against the English authority.
          3. Accessibility review of DOCX and PDF outputs.
          4. Legal/regulatory review of claims and references.
          5. Page-by-page prepress review, including figure labels, clipping, overlap, glyphs, tables, links, and readability.

          ## Evidence rule

          A review is valid only when the reviewer records identity, date, scope, method, disposition, limitations, evidence path, and this exact SHA. Any change to a reviewed publication file invalidates the prior approval until re-review.
          EOF

            (
              cd "$packet"
              find . -type f -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt
            )
          done

          printf '%s\n' "$sha" > "$out/CANDIDATE_SHA.txt"
          find "$out" -type f -print0 | sort -z | xargs -0 sha256sum > "$out/ALL_REVIEW_PACKETS_SHA256SUMS.txt"

      - name: Upload review packets
        uses: actions/upload-artifact@v4
        with:
          name: human-review-packets-${{ github.sha }}
          path: review-packets/
          retention-days: 90
          if-no-files-found: error
