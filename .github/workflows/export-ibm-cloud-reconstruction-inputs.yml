name: Export IBM Cloud reconstruction inputs

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/export-ibm-cloud-reconstruction-inputs.yml
      - manuals/cloud-ai-security/ibm-cloud/**
  push:
    branches:
      - translation/reconstruct-full-ptbr-and-review-es419
    paths:
      - .github/workflows/export-ibm-cloud-reconstruction-inputs.yml

permissions:
  contents: read

jobs:
  export-inputs:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact branch commit
        uses: actions/checkout@v4

      - name: Validate required files and translation memories
        shell: bash
        run: |
          set -euo pipefail
          test -f manuals/cloud-ai-security/ibm-cloud/en/IBM_Cloud_AI_Security_Manual_en_v1.0.docx
          test -f manuals/cloud-ai-security/ibm-cloud/pt-BR/Manual_de_Seguranca_de_IA_na_IBM_Cloud_pt-BR_v1.0.docx
          for platform in aws google-cloud microsoft-azure oracle-cloud; do
            test "$(find manuals/cloud-ai-security/$platform/en -maxdepth 1 -name '*.docx' | wc -l)" -ge 1
            test "$(find manuals/cloud-ai-security/$platform/pt-BR -maxdepth 1 -name '*.docx' | wc -l)" -ge 1
          done
          find manuals/cloud-ai-security/ibm-cloud \
               manuals/cloud-ai-security/aws \
               manuals/cloud-ai-security/google-cloud \
               manuals/cloud-ai-security/microsoft-azure \
               manuals/cloud-ai-security/oracle-cloud \
               -type f \( -name '*.docx' -o -name 'README.md' \) -print0 \
            | sort -z \
            | xargs -0 sha256sum > IBM_CLOUD_INPUT_SHA256SUMS.txt

      - name: Upload exact reconstruction inputs and validated memories
        uses: actions/upload-artifact@v4
        with:
          name: ibm-cloud-reconstruction-inputs-${{ github.sha }}
          if-no-files-found: error
          retention-days: 7
          path: |
            manuals/cloud-ai-security/ibm-cloud/en/*.docx
            manuals/cloud-ai-security/ibm-cloud/pt-BR/*.docx
            manuals/cloud-ai-security/ibm-cloud/en/README.md
            manuals/cloud-ai-security/ibm-cloud/pt-BR/README.md
            manuals/cloud-ai-security/aws/en/*.docx
            manuals/cloud-ai-security/aws/pt-BR/*.docx
            manuals/cloud-ai-security/google-cloud/en/*.docx
            manuals/cloud-ai-security/google-cloud/pt-BR/*.docx
            manuals/cloud-ai-security/microsoft-azure/en/*.docx
            manuals/cloud-ai-security/microsoft-azure/pt-BR/*.docx
            manuals/cloud-ai-security/oracle-cloud/en/*.docx
            manuals/cloud-ai-security/oracle-cloud/pt-BR/*.docx
            scripts/repair_aws_ptbr_translation.py
            scripts/repair_azure_ptbr_translation.py
            scripts/repair_google_cloud_ptbr_translation.py
            scripts/repair_oracle_cloud_ptbr_translation.py
            IBM_CLOUD_INPUT_SHA256SUMS.txt
