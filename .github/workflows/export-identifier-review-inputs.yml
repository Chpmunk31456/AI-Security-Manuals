name: Export identifier review inputs

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/export-identifier-review-inputs.yml
  push:
    branches:
      - translation/reconstruct-full-ptbr-and-review-es419
    paths:
      - .github/workflows/export-identifier-review-inputs.yml

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate review files
        run: |
          set -euo pipefail
          for family in ai-risk-management iso-iec-42001; do
            for lang in en es-419 pt-BR; do
              test "$(find manuals/$family/$lang -maxdepth 1 -name '*.docx' | wc -l)" -eq 1
            done
          done
      - name: Upload identifier review inputs
        uses: actions/upload-artifact@v4
        with:
          name: identifier-review-inputs-${{ github.sha }}
          retention-days: 7
          if-no-files-found: error
          path: |
            manuals/ai-risk-management/en/*.docx
            manuals/ai-risk-management/es-419/*.docx
            manuals/ai-risk-management/pt-BR/*.docx
            manuals/iso-iec-42001/en/*.docx
            manuals/iso-iec-42001/es-419/*.docx
            manuals/iso-iec-42001/pt-BR/*.docx
