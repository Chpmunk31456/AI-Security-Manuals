name: Export Kali review inputs

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/export-kali-review-inputs.yml
  push:
    branches:
      - translation/reconstruct-full-ptbr-and-review-es419
    paths:
      - .github/workflows/export-kali-review-inputs.yml

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate and checksum Kali packages
        shell: bash
        run: |
          set -euo pipefail
          test -d manuals/kali-linux-ai-security-forensics/en
          test -d manuals/kali-linux-ai-security-forensics/pt-BR
          find manuals/kali-linux-ai-security-forensics/en manuals/kali-linux-ai-security-forensics/pt-BR \
            -maxdepth 1 -type f \( -name '*.docx' -o -name '*.pdf' -o -name 'README.md' \) -print0 \
            | sort -z | xargs -0 sha256sum > KALI_REVIEW_INPUT_SHA256SUMS.txt
      - name: Upload exact Kali review inputs
        uses: actions/upload-artifact@v4
        with:
          name: kali-review-inputs-${{ github.sha }}
          retention-days: 7
          if-no-files-found: error
          path: |
            manuals/kali-linux-ai-security-forensics/en/*.docx
            manuals/kali-linux-ai-security-forensics/en/*.pdf
            manuals/kali-linux-ai-security-forensics/en/README.md
            manuals/kali-linux-ai-security-forensics/pt-BR/*.docx
            manuals/kali-linux-ai-security-forensics/pt-BR/*.pdf
            manuals/kali-linux-ai-security-forensics/pt-BR/README.md
            KALI_REVIEW_INPUT_SHA256SUMS.txt
