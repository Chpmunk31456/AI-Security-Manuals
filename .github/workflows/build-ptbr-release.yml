name: Build Brazilian Portuguese manuals

on:
  workflow_dispatch:
  push:
    branches:
      - production/pt-br-manuals
    paths:
      - scripts/build_ptbr_release.py
      - .github/workflows/build-ptbr-release.yml

permissions:
  contents: write

jobs:
  build:
    if: ${{ !contains(github.event.head_commit.message, '[skip ptbr build]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: production/pt-br-manuals
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install production tools
        run: |
          sudo apt-get update
          sudo apt-get install -y libreoffice poppler-utils
          python -m pip install --upgrade pip
          python -m pip install python-docx
      - name: Generate Portuguese DOCX and PDF packages
        run: python scripts/build_ptbr_release.py
      - name: Verify generated inventory
        run: |
          test "$(find manuals -path '*/pt-BR/*.docx' | wc -l)" -ge 8
          test "$(find manuals -path '*/pt-BR/*.pdf' | wc -l)" -ge 8
          for f in $(find manuals -path '*/pt-BR/*.pdf'); do pdftotext "$f" - | grep -q '[[:alpha:]]'; done
      - name: Commit generated release
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md CHANGELOG.md PT_BR_PRODUCTION_STATUS.md manuals
          if git diff --cached --quiet; then
            echo 'No generated changes to commit.'
          else
            git commit -m 'Publish seven Brazilian Portuguese AI security manuals [skip ptbr build]'
            git push origin HEAD:production/pt-br-manuals
          fi
